<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { overflow: hidden; background: #000000; margin: 0; color: #000000; font-family: "Press Start 2P", cursive; }
      #game { display: none; width: 100vw; height: 100vh; }
      #startButton { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; width: 160px; height: 40px; background-color: #4caf50; color: white; text-align: center; text-decoration: none; font-size: 16px; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0px 0px 10px 2px #000000; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="game"></div>
    <button id="startButton">PLAY</button>
    <script>
      function safeParentApi() { try { if (window.parent && typeof window.parent.maeExportApis_ === "function") window.parent.maeExportApis_(); } catch (error) { console.warn("Parent API not available:", error); } }
      safeParentApi();
      const startButton = document.getElementById("startButton");
      const gameContainer = document.getElementById("game");
      function startGame() {
        gameContainer.style.display = "block"; startButton.style.display = "none";
        EJS_player = "#game"; EJS_core = "gba"; EJS_color = "#000000"; EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/bubblfan/emu@master/";
        EJS_gameUrl = "https://cdn.jsdelivr.net/gh/ap-math-class/exams@main/gb/Glazed (9.2.0).7z";
        loadGame();
      }
      function loadGame() {
        if (document.querySelector('script[src*="loader.js"]')) return;
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js";
        script.async = true; document.body.appendChild(script);
      }
      startButton.addEventListener("click", startGame);
    </script>
  </body>
</html>
