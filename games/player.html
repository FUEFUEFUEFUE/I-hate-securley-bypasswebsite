<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmulatorJS Player</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #game-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const requestedGame = params.get('game') || '';
      const requestedRom = params.get('rom') || '';
      const requestedCore = params.get('core') || '';

      const normalizeGameName = (value) => {
        return String(value || '')
          .split('/').pop()
          .replace(/\.[^.]+$/, '')
          .replace(/^cl/i, '')
          .replace(/[_-]+/g, ' ')
          .trim() || 'Game';
      };

      const pathtodata = 'https://cdn.jsdelivr.net/gh/bubblfan/emu@master/';

      function resolveCoreFromFile(name) {
        const lower = String(name || '').toLowerCase();
        if (lower.includes('gba')) return 'gba';
        if (lower.includes('nes')) return 'nes';
        if (lower.includes('snes')) return 'snes';
        if (lower.includes('genesis') || lower.includes('megadrive')) return 'genesis';
        if (lower.includes('n64')) return 'n64';
        if (lower.includes('gameboy') || lower.includes('gb')) return 'gb';
        if (lower.includes('gba') || lower.includes('pokemon')) return 'gba';
        return 'gba';
      }

      function extractScriptValue(source, key) {
        const patterns = [
          new RegExp(`${key}\\s*[:=]\\s*["']([^"']+)["']`, 'i'),
          new RegExp(`${key}\\s*=\\s*"([^"]+)"`, 'i'),
          new RegExp(`${key}\\s*=\\s*'([^']+)'`, 'i'),
          new RegExp(`${key}\\s*:\\s*"([^"]+)"`, 'i')
        ];

        for (const pattern of patterns) {
          const match = source.match(pattern);
          if (match && match[1]) return match[1];
        }

        return '';
      }

      async function loadGameConfig() {
        let gameUrl = requestedRom;
        let core = requestedCore;
        let gameName = 'Retro Game';

        if (!gameUrl && requestedGame) {
          try {
            const response = await fetch(requestedGame, { cache: 'no-store' });
            if (response.ok) {
              const source = await response.text();
              const extractedUrl = extractScriptValue(source, 'EJS_gameUrl') || source.match(/https?:\\/\\/[^\s"'<>]+(?:\\.(?:gba|nes|smc|sfc|md|gen|n64|gb|gbc|zip|nds|gba))[^\s"'<>]*/i)?.[0];
              const extractedCore = extractScriptValue(source, 'EJS_core') || resolveCoreFromFile(requestedGame);
              const extractedName = extractScriptValue(source, 'EJS_gameName') || normalizeGameName(requestedGame);

              if (extractedUrl) gameUrl = extractedUrl;
              if (extractedCore) core = extractedCore;
              if (extractedName) gameName = extractedName;
            }
          } catch (error) {
            console.warn('Could not resolve game metadata:', error);
          }
        }

        if (!gameUrl) {
          gameUrl = 'https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/games/pokemonemerald/pokemonemerald.gba';
        }

        if (!core) {
          core = resolveCoreFromFile(requestedGame || gameUrl);
        }

        window.EJS_player = '#game-container';
        window.EJS_pathtodata = pathtodata;
        window.EJS_core = core;
        window.EJS_gameName = gameName;
        window.EJS_gameUrl = gameUrl;
        window.EJS_startOnLoaded = true;
        window.EJS_color = '#000000';
      }

      loadGameConfig().then(() => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/bubblfan/emu@master/loader.js';
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
