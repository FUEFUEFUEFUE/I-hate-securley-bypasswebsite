<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">Game Hub</div>
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search games..."
        aria-label="Search games"
      />
    </div>

    <main id="grid" class="grid" aria-live="polite"></main>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-label="Game preview">
        <button id="closeBtn" class="close" aria-label="Close game">×</button>
        <div class="player-wrap">
          <iframe id="player" title="Game preview" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </div>

    <p class="footer-note">Showing only local games. Network-dependent ROM/emulator games have been hidden.</p>

    <script>
      const games = [
        {
          id: 'ttt',
          title: 'Tic Tac Toe',
          desc: 'A local single-file browser game.',
          file: 'games/tictactoe.html'
        },
        {
          id: 'template',
          title: 'Game Template',
          desc: 'Copy this template to build your own local game.',
          file: 'games/games/game-template.html'
        }
      ];

      const grid = document.getElementById('grid');
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      const closeBtn = document.getElementById('closeBtn');
      const search = document.getElementById('search');

      function isGameScreenActive() {
        return modal.getAttribute('aria-hidden') === 'false' && player.src && player.src !== 'about:blank';
      }

      function confirmLeaveScreen() {
        if (!isGameScreenActive()) return true;
        return window.confirm('You are leaving the current game screen. Do you want to continue?');
      }

      function renderGames(list) {
        grid.innerHTML = '';

        list.forEach((game) => {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <h3>${escapeHtml(game.title)}</h3>
              <p>${escapeHtml(game.desc || '')}</p>
            </div>
            <div class="actions">
              <button class="btn play-btn" data-file="${encodeURIComponent(game.file)}">Play</button>
              <button class="btn secondary info-btn" data-file="${encodeURIComponent(game.file)}">Info</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function openModalWith(file) {
        if (!file) return;

        if (isGameScreenActive() && !confirmLeaveScreen()) {
          return;
        }

        player.src = file;
        modal.setAttribute('aria-hidden', 'false');
      }

      closeBtn.addEventListener('click', () => {
        if (!confirmLeaveScreen()) {
          return;
        }

        modal.setAttribute('aria-hidden', 'true');
        player.src = 'about:blank';
      });

      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          closeBtn.click();
        }
      });

      document.addEventListener('click', (event) => {
        const button = event.target.closest('.btn');
        if (!button) return;

        const file = decodeURIComponent(button.dataset.file || '');
        if (!file) return;

        openModalWith(file);
      });

      search.addEventListener('input', () => {
        const query = search.value.trim().toLowerCase();
        const filtered = games.filter((game) => {
          const haystack = `${game.title} ${game.desc || ''}`.toLowerCase();
          return haystack.includes(query);
        });

        renderGames(filtered);
      });

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character]));
      }

      renderGames(games);
    </script>
  </body>
</html>
