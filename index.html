    <div class="topbar">

        id="search"

        type="search"
        placeholder="Search games..."
        aria-label="Search games"

        <button id="closeBtn" class="close" aria-label="Close game">×</button>
        <div class="player-wrap">
          <iframe
            id="player"
            title="Game preview"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
          ></iframe>
        </div>
      </div>
    </div>

    <p class="footer-note">Games are loaded locally in an embedded iframe. Serve the site over HTTP, not as a raw file.</p>

        { title: 'Pokemon SM Red', file: 'games/clpokemonsmred.html' },
        { title: 'Pokemon SORS', file: 'games/clpokemonsors.html' },
        { title: 'Pokemon SORS 2', file: 'games/clpokemonsors2.html' },
        { title: 'Pokemon Ultimate Fusion', file: 'games/clpokemonultimatefusion.html' },
        { title: 'Pokemon Unbound', file: 'games/clpokemonunbound.html' },
        { title: 'Pokemon Moon Emerald', file: 'games/clpokemoonemerald.html' },
        { title: 'Pokemon Moon Galaxy', file: 'games/clpokemoongalaxy.html' }
      ];

      const normalizeGame = (game) => {
        const file = typeof game.file === 'string' ? game.file : game.path || '';
        const title = game.title || file.split('/').pop().replace(/\.html?$/i, '').replace(/^cl/i, '').trim() || 'Untitled Game';
        return {
          id: String(game.id || `${title}-${file}`),
          title,
          desc: game.desc || 'Loaded from the games folder.',
          file
        };
      };

      const grid = document.getElementById('grid');
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      const closeBtn = document.getElementById('closeBtn');
      const search = document.getElementById('search');

      let games = [];

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>\"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character]));
      }

      function renderGames(list) {
        grid.innerHTML = '';

        list.forEach((game) => {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <h3>${escapeHtml(game.title)}</h3>
              <p>${escapeHtml(game.desc || '')}</p>
            </div>
            <div class="actions">
              <button class="btn play-btn" data-file="${encodeURIComponent(game.file)}">Play</button>
              <button class="btn secondary info-btn" data-file="${encodeURIComponent(game.file)}">Info</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function isGameScreenActive() {
        return modal.getAttribute('aria-hidden') === 'false' && player.src && player.src !== 'about:blank';
      }

      function confirmLeaveScreen() {
        if (!isGameScreenActive()) return true;
        return window.confirm('You are leaving the current game screen. Do you want to continue?');
      }

      function openModalWith(file) {
        if (!file) return;

        if (/^https?:\/\//i.test(file)) {
          window.open(file, '_blank', 'noopener,noreferrer');
          return;
        }

        const target = new URL(file, window.location.href).toString();
        const current = player.src ? new URL(player.src, window.location.href).toString() : '';

        if (current && current !== target && !confirmLeaveScreen()) {
          return;
        }

        player.src = file;
        modal.setAttribute('aria-hidden', 'false');
      }

      closeBtn.addEventListener('click', () => {
        if (!confirmLeaveScreen()) {
          return;
        }

        modal.setAttribute('aria-hidden', 'true');
        player.src = 'about:blank';
      });

      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          closeBtn.click();
        }
      });

      document.addEventListener('click', (event) => {
        const button = event.target.closest('.btn');
        if (!button) return;

        const file = decodeURIComponent(button.dataset.file || '');
        if (!file) return;

        openModalWith(file);
      });

      search.addEventListener('input', () => {
        const query = search.value.trim().toLowerCase();
        const filtered = games.filter((game) => {
          const haystack = `${game.title} ${game.desc || ''}`.toLowerCase();
          return haystack.includes(query);
        });

        renderGames(filtered);
      });

      async function loadGames() {
        try {
          const response = await fetch('games.json', { cache: 'no-store' });
          if (!response.ok) throw new Error('Manifest not found');
          const payload = await response.json();
          const manifest = Array.isArray(payload) ? payload : Array.isArray(payload.games) ? payload.games : [];
          games = manifest.map(normalizeGame);
        } catch (error) {
          games = fallbackGames.map(normalizeGame);
        }

        const azaharWeb = normalizeGame({
          title: 'Azahar Web',
          file: 'https://azahar-emu.org/',
          desc: 'Play compatible 3DS games in the browser with Azahar Web.'
        });

        if (!games.some((game) => game.title.toLowerCase() === azaharWeb.title.toLowerCase())) {
          games.push(azaharWeb);
        }

        if (!games.length) {
          games = fallbackGames.map(normalizeGame);
        }

        games.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
        renderGames(games);
      }

      loadGames();
    </script>
