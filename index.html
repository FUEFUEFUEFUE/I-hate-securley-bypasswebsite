<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Hub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="brand">Game Hub</div>
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search games..."
        aria-label="Search games"
      />
    </div>

    <main id="grid" class="grid" aria-live="polite"></main>

    <div id="modal" class="modal" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-label="Game preview">
        <button id="closeBtn" class="close" aria-label="Close game">×</button>
        <div class="player-wrap">
          <iframe id="player" title="Game preview" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </div>

    <p class="footer-note">Games are loaded locally in an embedded iframe.</p>

    <script>
      const gameFiles = [
        "games/games/game-template.html",
        "games/tictactoe.html",
        "games/clA Walk in The Forest (v1.0).html",
        "games/clAcko_s Mach Bike Challenge (v1.0).html",
        "games/clCeliasStupidROMHack.html",
        "games/clHoennsLastWish.html",
        "games/clInkwell (v1.04).html",
        "games/clMoemon Emerald Vanilla+ (v1.1.0).html",
        "games/clPokeAmbrosia.html",
        "games/clPokeEmeraldRogueEX.html",
        "games/clPokeFusion3.html",
        "games/clPokemonemeraldrouge.html",
        "games/clPokemonrocketedition.html",
        "games/clPokémon TWO (v1.1).html",
        "games/clPokémon Trade&Stache (V1.1).html",
        "games/clPokémonstunningsteel.html",
        "games/clarceuslegend.html",
        "games/clfrlgips.html",
        "games/clheartandsoul1.2.1.html",
        "games/clinclementemerald.html",
        "games/cllastfirered.html",
        "games/clletsgoeevee.html",
        "games/clletsgopikachu.html",
        "games/clmoonemeraldextremerandomizer.html",
        "games/cloopsalleevees.html",
        "games/clpokeaestheticred.html",
        "games/clpokeallin.html",
        "games/clpokebattlefact.html",
        "games/clpokeblue.html",
        "games/clpokeclassic.html",
        "games/clpokecrown.html",
        "games/clpokecrystaladvanceredux.html",
        "games/clpokecrystalclear.html",
        "games/clpokecrystalinheritance.html",
        "games/clpokecrystallegacy.html",
        "games/clpokedreamstone.html",
        "games/clpokeeliteredux.html",
        "games/clpokeelysiuma.html",
        "games/clpokeelysiumb.html",
        "games/clpokeemerald47.html",
        "games/clpokeemeraldbattlefrontier.html",
        "games/clpokeemeraldenhanced.html",
        "games/clpokeemeraldexceeded.html",
        "games/clpokeemeraldextendedcut.html",
        "games/clpokeemeraldflow.html",
        "games/clpokeemeraldhorizons.html",
        "games/clpokeemeraldimperium.html",
        "games/clpokeemeraldlegacy.html",
        "games/clpokeemeraldrandom.html",
        "games/clpokeemeraldrto6.html",
        "games/clpokeemeraldxtreme.html",
        "games/clpokeemeraldz.html",
        "games/clpokeexceeded.html",
        "games/clpokefireemerald.html",
        "games/clpokefiregold.html",
        "games/clpokeflora.html",
        "games/clpokefrlgplus.html",
        "games/clpokefuseddimension.html",
        "games/clpokegaia.html",
        "games/clpokegigared.html",
        "games/clpokeglazed.html",
        "games/clpokegschronicles.html",
        "games/clpokelightplatinum.html",
        "games/clpokeliquidcrysta.html",
        "games/clpokelowbudgetcrystal.html",
        "games/clpokemegamoemon.html",
        "games/clpokemonamnesia.html",
        "games/clpokemonbillssecretgarden.html",
        "games/clpokemonclover.html",
        "games/clpokemoncrystal.html",
        "games/clpokemonemerald.html",
        "games/clpokemonemeraldcrest.html",
        "games/clpokemonemeraldkaizo.html",
        "games/clpokemonemeraldmini.html",
        "games/clpokemonemeraldseaglass.html",
        "games/clpokemonenergizedemerald.html",
        "games/clpokemonevolvedsfdgsdfs.html",
        "games/clpokemonfirered.html",
        "games/clpokemonfireredrandomized.html",
        "games/clpokemongold.html",
        "games/clpokemonkaizoironfirered.html",
        "games/clpokemonlazarus.html",
        "games/clpokemonleafgreen.html",
        "games/clpokemonmodernemerald.html",
        "games/clpokemonmysterydungeon.html",
        "games/clpokemonperfectemerald5.5.html",
        "games/clpokemonpinball.html",
        "games/clpokemonquetzal.html",
        "games/clpokemonroaringred.html",
        "games/clpokemonsaiph.html",
        "games/clpokemonsaiph2.html",
        "games/clpokemonsapphire.html",
        "games/clpokemonshinsigma.html",
        "games/clpokemonsilver.html",
        "games/clpokemonslgreen.html",
        "games/clpokemonsmred.html",
        "games/clpokemonsors.html",
        "games/clpokemonsors2.html",
        "games/clpokemonultimatefusion.html",
        "games/clpokemonunbound.html",
        "games/clpokemoonemerald.html",
        "games/clpokemoongalaxy.html"
      ].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

      function formatGameTitle(file) {
        const raw = decodeURIComponent(file.split('/').pop().replace(/\.html?$/i, ''));
        if (raw === 'game-template') return 'Game Template';

        const cleaned = raw.replace(/^cl/i, '').trim();
        return cleaned
          .replace(/([a-z])([A-Z])/g, '$1 $2')
          .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
          .replace(/[_-]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim() || 'Untitled Game';
      }

      const games = gameFiles.map((file, index) => ({
        id: `${index}-${file.replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase()}`,
        title: formatGameTitle(file),
        desc: 'Loaded from the games folder.',
        file
      }));

      const grid = document.getElementById('grid');
      const modal = document.getElementById('modal');
      const player = document.getElementById('player');
      const closeBtn = document.getElementById('closeBtn');
      const search = document.getElementById('search');

      function isGameScreenActive() {
        return modal.getAttribute('aria-hidden') === 'false' && player.src && player.src !== 'about:blank';
      }

      function confirmLeaveScreen() {
        if (!isGameScreenActive()) return true;
        return window.confirm('You are leaving the current game screen. Do you want to continue?');
      }

      function renderGames(list) {
        grid.innerHTML = '';

        list.forEach((game) => {
          const card = document.createElement('article');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <h3>${escapeHtml(game.title)}</h3>
              <p>${escapeHtml(game.desc || '')}</p>
            </div>
            <div class="actions">
              <button class="btn play-btn" data-file="${encodeURIComponent(game.file)}">Play</button>
              <button class="btn secondary info-btn" data-file="${encodeURIComponent(game.file)}">Info</button>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function openModalWith(file) {
        if (!file) return;

        const target = new URL(file, window.location.href).toString();
        const current = player.src ? new URL(player.src, window.location.href).toString() : '';

        if (current && current !== target && !confirmLeaveScreen()) {
          return;
        }

        player.src = file;
        modal.setAttribute('aria-hidden', 'false');
      }

      closeBtn.addEventListener('click', () => {
        if (!confirmLeaveScreen()) {
          return;
        }

        modal.setAttribute('aria-hidden', 'true');
        player.src = 'about:blank';
      });

      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          closeBtn.click();
        }
      });

      document.addEventListener('click', (event) => {
        const button = event.target.closest('.btn');
        if (!button) return;

        const file = decodeURIComponent(button.dataset.file || '');
        if (!file) return;

        openModalWith(file);
      });

      search.addEventListener('input', () => {
        const query = search.value.trim().toLowerCase();
        const filtered = games.filter((game) => {
          const haystack = `${game.title} ${game.desc || ''}`.toLowerCase();
          return haystack.includes(query);
        });

        renderGames(filtered);
      });

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character]));
      }

      renderGames(games);
    </script>
  </body>
</html>
